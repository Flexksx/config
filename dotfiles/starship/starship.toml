palette = "noctalia"

format = "$os[$directory](bold fg:secondary)[ $git_branch](fg:tertiary)[$git_status](fg:tertiary)$cmd_duration$line_break$character"

right_format = "[$time](fg:on_surface_variant)"

[palettes.noctalia]
primary = "{{colors.primary.default.hex}}"
on_primary = "{{colors.on_primary.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
on_secondary = "{{colors.on_secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
on_tertiary = "{{colors.on_tertiary.default.hex}}"
surface = "{{colors.surface.default.hex}}"
on_surface = "{{colors.on_surface.default.hex}}"
surface_variant = "{{colors.surface_variant.default.hex}}"
on_surface_variant = "{{colors.on_surface_variant.default.hex}}"
background = "{{colors.background.default.hex}}"
error = "{{colors.error.default.hex}}"
on_error = "{{colors.on_error.default.hex}}"

[os]
disabled = false
format = "[ $symbol](bold fg:primary) "

[os.symbols]
NixOS = " "

[directory]
format = "[ $path ](bold fg:secondary)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
format = "[$symbol $branch](fg:tertiary)"

[git_status]
format = "[ $all_status$ahead_behind](fg:tertiary)"
conflicted = "~"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+$count"
renamed = "»"
deleted = "✘"

[cmd_duration]
format = " [⏱ $duration](bold fg:primary)"
min_time = 2000
show_milliseconds = false

[character]
success_symbol = "[❯](bold fg:on_surface)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:primary)"
vimcmd_replace_one_symbol = "[❮](bold fg:primary)"
vimcmd_replace_symbol = "[❮](bold fg:primary)"
vimcmd_visual_symbol = "[❮](bold fg:primary)"

[time]
disabled = false
format = "[$time](fg:on_surface_variant)"
time_format = "%H:%M"

