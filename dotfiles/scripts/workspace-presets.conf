# Workspace Presets Configuration
# Format: PRESET_NAME|APP_COMMAND|CLASS_NAME|WORKSPACE|WORKING_DIR(optional)
#
# Notes:
# - APP_COMMAND: The command to launch the application
# - CLASS_NAME: The window class name (verify with: hyprctl clients -j | jq -r '.[].class')
# - WORKSPACE: Target workspace number (1-10)
# - WORKING_DIR: Optional working directory for apps that support it

