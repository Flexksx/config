pre-commit:
  parallel: true
  commands:
    alejandra:
      glob: "*.nix"
      run: alejandra -q {staged_files}
      stage_fixed: true
    stylua:
      glob: "*.lua"
      run: stylua {staged_files}
      stage_fixed: true
    lua-comments:
      glob: "*.lua"
      run: scripts/check-lua-comments.sh {staged_files}
    biome:
      glob: "*.{ts,js,mjs}"
      run: bun x biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    rumdl:
      glob: "*.md"
      run: rumdl fmt {staged_files}
      stage_fixed: true
    shfmt:
      glob: "*.sh"
      run: shfmt -w {staged_files}
      stage_fixed: true
    taplo:
      glob: "*.toml"
      run: taplo fmt {staged_files}
      stage_fixed: true
    yamlfmt:
      glob: "*.{yml,yaml}"
      run: yamlfmt {staged_files}
      stage_fixed: true
